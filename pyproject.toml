[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "botsensai"
version = "0.1.0"
description = "Agentic memecoin recon, scoring, backtesting, paper-trading and content engine for Solana launchpads"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Botsensai" }]

dependencies = [
    "httpx>=0.27",
    "anyio>=4.4",
    "pydantic>=2.7",
    # 2.14.2 fixes GHSA-4xgf-cpjx-pc3j: with `secrets_nested_subdir=True` a
    # symlink inside `secrets_dir` was followed out of the directory, reading
    # arbitrary local files into settings. Botsensai reads secrets from the
    # environment and never sets that flag, so the exposure was latent — but
    # this is a floor, not a preference. See `python scripts/audit.py`.
    "pydantic-settings>=2.14.2",
    # 1.2.2 fixes PYSEC-2026-2270: `set_key()`/`unset_key()` followed symlinks
    # when rewriting `.env`. We only ever read, so again latent, and again a floor.
    "python-dotenv>=1.2.2",
    "orjson>=3.10",
    "structlog>=24.1",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "networkx>=3.3",
    "tenacity>=8.3",
    "cachetools>=5.3",
    "python-dateutil>=2.9",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # The pump.fun mint firehose is a websocket and httpx does not speak one.
    # Pure Python, no build step, no transitive weight — this is the cheapest
    # way to stop discovering tokens a poll interval late.
    "websockets>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
ml = ["scikit-learn>=1.5", "lightgbm>=4.3"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    # Drives `python scripts/audit.py`. Bare `pip-audit` audits the whole
    # interpreter, which on a conda base env is mostly packages this repo
    # neither depends on nor can fix; the script scopes it to our closure.
    "pip-audit>=2.7",
]

[project.scripts]
botsensai = "botsensai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/botsensai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# UP042 wants StrEnum. These enums are deliberately `str, Enum`: the pattern
# serializes to JSON without a custom encoder and keeps `.value` comparisons
# working identically across the codebase.
# SIM102/SIM103/SIM108 collapse nested conditionals that are clearer expanded,
# particularly in the veto engine where each branch documents a distinct rule.
ignore = ["E501", "B008", "UP042", "SIM102", "SIM103", "SIM108"]

[tool.mypy]
# Deliberately no `python_version`. Pinning it to 3.11 while running on a 3.13
# interpreter made mypy read 3.13's numpy stubs under 3.11 rules, and
# `numpy/__init__.pyi` uses a PEP 695 `type` statement — one syntax error that
# aborted the whole run before a single line of ours was checked. Letting mypy
# follow the interpreter keeps stubs and rules in agreement; ruff's
# `target-version = "py311"` is what holds the language floor.
ignore_missing_imports = true
warn_unused_ignores = false
