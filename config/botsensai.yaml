# Botsensai configuration.
# Every value here is overridable by environment variable with the BOTSENSAI_
# prefix; nested sections use a double underscore, e.g. BOTSENSAI_RISK__MAX_POSITION_NATIVE.
#
# Secrets are NOT read from this file. RPC keys, API tokens and wallet paths come
# from the environment only, so this file is safe to commit.

trading_mode: live
dry_run: false
log_level: INFO
db_path: data/botsensai.db
seed: 1337

browser:
  headless: true
  stealth: true
  user_data_dir: /Users/drop/botsensai-browser-profile
  max_pages: 4
  block_resources: [image, media, font]

x_session:
  enabled: false
  acknowledged_burner: false
  requests_per_minute: 20
  max_tokens_per_sweep: 6
  reply_threshold: 5
  engager_threshold: 25
  verify_every_sweep: false

risk:
  max_position_native: 0.25          # SOL per position
  max_portfolio_exposure_native: 2.0
  max_concurrent_positions: 15
  max_daily_loss_native: 1.0
  max_trades_per_hour: 20
  min_liquidity_usd: 6000
  min_token_age_seconds: 90
  max_token_age_seconds: 21600
  max_slippage_bps: 500
  stop_loss_pct: 0.20
  take_profit_multiples: [1.8, 3.5, 6.0, 10.0]
  take_profit_fractions: [0.35, 0.35, 0.15, 0.15]
  trailing_stop_pct: 0.25
  max_hold_seconds: 21600
  kill_switch: false
  momentum_stop_seconds: 90
  momentum_min_gain_pct: 0.10

execution:
  base_latency_ms: 250
  latency_jitter_ms: 100
  priority_fee_lamports: 1000000
  jito_tip_lamports: 1000000
  platform_fee_bps: 100
  lp_fee_bps: 30
  fail_probability: 0.01
  sandwich_probability: 0.02
  sandwich_extra_bps: 50

scoring:
  weights_version: v_heavy_artillery
  weights_path: config/weights.json
  min_coverage: 0.20                 # Pure on-chain reads without requiring Twitter
  entry_threshold: 0.65
  exit_threshold: 0.35
  veto_top10_share: 0.55
  veto_insider_share: 0.30
  veto_bundle_share: 0.35
  veto_deployer_rug_count: 1
  veto_inauthenticity: 0.75

memory:
  enabled: true
  path: data/memory.db
  decay_half_life_hours: 72
  min_confidence_to_apply: 0.35
  autowrite_postmortems: true

media:
  enabled: true
  output_dir: data/content
  require_disclosure: true
  max_posts_per_hour: 6

collectors:
  pumpfun:
    timeout_seconds: 15.0
  dexscreener:
    timeout_seconds: 10.0
  geckoterminal:
    timeout_seconds: 10.0
  x:
    enabled: false
    timeout_seconds: 5.0
  reddit:
    enabled: false
    timeout_seconds: 5.0
  instagram:
    enabled: false
  tiktok:
    enabled: false
  fourchan:
    enabled: false
  telegram:
    enabled: false

backtest:
  train_days: 14
  test_days: 7
  step_days: 7
  embargo_hours: 24
  initial_capital_native: 10.0
  min_trades_for_significance: 50
  bootstrap_samples: 2000
