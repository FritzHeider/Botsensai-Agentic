# Botsensai configuration.
# Every value here is overridable by environment variable with the BOTSENSAI_
# prefix; nested sections use a double underscore, e.g. BOTSENSAI_RISK__MAX_POSITION_NATIVE.
#
# Secrets are NOT read from this file. RPC keys, API tokens and wallet paths come
# from the environment only, so this file is safe to commit.

trading_mode: paper        # backtest | paper | live (live is not implemented)
dry_run: true
log_level: INFO
db_path: data/botsensai.db
seed: 1337
      
browser:
  headless: true
  stealth: true
  user_data_dir: /Users/drop/botsensai-browser-profile
  max_pages: 4
  block_resources: [image, media, font]
  # A Chrome profile directory you have logged in to by hand. Keep it OUTSIDE
  # this repository. Off by default; collectors degrade rather than fail without it.

# Session-backed X collection. Reply text, view/bookmark counts and per-engager
# account ages exist on no free X path, and they are the inputs to most of the
# social-authenticity family — see docs/X_SESSION.md before enabling.
#
# Botsensai never handles a credential: no password field, no login flow, no
# cookie written into the repo. You log in once by hand; this reads that profile.
#
# Use an account you are willing to lose. Sustained automated reads from a
# logged-in account are against X's terms and the realistic consequence is
# suspension of that account.
x_session:
  enabled: false
  acknowledged_burner: false   # set true only after confirming this is a throwaway
  requests_per_minute: 20      # roughly what an actively-browsing human generates
  max_tokens_per_sweep: 6
  reply_threshold: 5           # min replies before spending a load on the thread
  engager_threshold: 25        # min engagement before loading the liker lists
  verify_every_sweep: false

risk:
  max_position_native: 0.25          # SOL per position
  max_portfolio_exposure_native: 2.0
  max_concurrent_positions: 8
  max_daily_loss_native: 1.0
  max_trades_per_hour: 20
  min_liquidity_usd: 5000
  min_token_age_seconds: 45
  max_token_age_seconds: 21600
  max_slippage_bps: 800
  stop_loss_pct: 0.45
  take_profit_multiples: [2.0, 4.0, 10.0]
  take_profit_fractions: [0.4, 0.3, 0.3]
  trailing_stop_pct: 0.35
  max_hold_seconds: 14400
  kill_switch: false

execution:
  base_latency_ms: 450
  latency_jitter_ms: 250
  priority_fee_lamports: 1000000
  jito_tip_lamports: 1000000
  platform_fee_bps: 100
  lp_fee_bps: 30
  fail_probability: 0.06             # transactions do fail; modelling zero flatters everything
  sandwich_probability: 0.10
  sandwich_extra_bps: 150

scoring:
  weights_version: v0
  weights_path: config/weights.json
  min_coverage: 0.5                  # refuse to act on a thin read
  entry_threshold: 0.68
  exit_threshold: 0.35
  veto_top10_share: 0.55             # relaxed by +0.30 pre-graduation, where concentration is structural
  veto_insider_share: 0.30
  veto_bundle_share: 0.35
  veto_deployer_rug_count: 1
  veto_inauthenticity: 0.75

memory:
  enabled: true
  path: data/memory.db
  decay_half_life_hours: 72
  min_confidence_to_apply: 0.35
  autowrite_postmortems: true

media:
  enabled: true
  output_dir: data/content
  require_disclosure: true
  max_posts_per_hour: 6

collectors:
  telegram:
    extra:
      # Telegram call channels read once per sweep, token-agnostically, on top
      # of the room each token publishes for itself. Handles only — a `t.me/`
      # URL or an `@handle` is accepted and normalized. Private invites
      # (`t.me/+…`, `joinchat`) cannot be read anonymously and are refused.
      #
      # This list is the *manual* half of the curation and it is deliberately
      # empty: no public call channel has been measured from here yet, and a
      # plausible-looking name committed without evidence is exactly the kind of
      # claim this repository is not allowed to make. The automatic half needs
      # no configuration — `botsensai.watchlist` seeds every sweep from the
      # Telegram links Dexscreener already published into the store, promoting
      # any room that several unrelated tokens point at.
      #
      # `python -m botsensai.cli channels --rank` prints each channel's median
      # lead time to the subsequent price peak, with the sample size beside it.
      # A channel whose median peak multiple is at or below 1.0 across three or
      # more measured calls is dropped from the watchlist automatically, whether
      # it was discovered or hand-added here.
      call_channels: []

backtest:
  train_days: 14
  test_days: 7
  step_days: 7
  embargo_hours: 24
  initial_capital_native: 10.0
  min_trades_for_significance: 50
  bootstrap_samples: 2000
