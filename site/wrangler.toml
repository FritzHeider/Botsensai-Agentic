name = "botsensai-site"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "fd2ff8c29a6d58c479032efea6c9ea62"
workers_dev = true

# Cloudflare Pages / Worker Assets Directory
assets = { directory = "." }

# Cloudflare R2 Bucket Binding for atomic live snapshot sync
[[r2_buckets]]
binding = "BOTSENSAI_R2"
bucket_name = "botsensai-backups"

# Observability Configuration
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

# Production Route (uncomment when domain DNS is mapped in Cloudflare Dashboard)
# routes = [
#   { pattern = "botsensai.com/*", zone_name = "botsensai.com" },
#   { pattern = "www.botsensai.com/*", zone_name = "botsensai.com" }
# ]
